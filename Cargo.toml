[package]
name = "kterm"
version = "0.1.5"
edition = "2024"

[dependencies]
alacritty_terminal = { version = "0.26.0", default-features = false }
bytemuck = { version = "1.25.2", features = ["derive"] }
crossfont = "0.9.0"
pollster = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
windows = { version = "0.62", features = [
    "Foundation",
    "UI_ViewManagement",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Shell",
] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winresource = "0.1.31"
